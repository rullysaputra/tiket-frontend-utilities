<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiket Analytics Utilities</title>
    <link rel="stylesheet" href="tailwind.css" />
  </head>
  <body class="w-[520px] bg-slate-50 text-slate-900 antialiased">
    <main class="flex max-h-[600px] flex-col">
      <header class="shrink-0 border-b border-slate-200 bg-white px-4 py-3">
        <div class="flex items-center justify-between gap-3">
          <div class="flex min-w-0 items-center gap-2">
            <img src="logo.png" alt="" width="24" height="24" class="size-6 shrink-0 rounded" />
            <h1 class="truncate text-sm font-semibold tracking-tight">
              Tiket's Analytics Utilities
            </h1>
          </div>
          <button
            id="refresh"
            class="shrink-0 rounded-md border border-slate-200 px-2.5 py-1 text-xs font-medium text-slate-600 hover:bg-slate-100 active:bg-slate-200"
          >
            Refresh
          </button>
        </div>
        <div class="mt-1.5 flex items-center gap-2">
          <span id="origin" class="min-w-0 flex-1 truncate font-mono text-xs text-slate-500">
            Reading…
          </span>
          <span
            id="count"
            class="shrink-0 rounded-full bg-slate-100 px-2 py-0.5 text-[11px] font-medium text-slate-600"
          ></span>
        </div>
      </header>

      <div id="toolbar" class="hidden shrink-0 border-b border-slate-200 bg-white px-4 py-2">
        <input
          id="search"
          type="search"
          autocomplete="off"
          placeholder="Filter fields and values…"
          class="w-full rounded-md border border-slate-200 bg-slate-50 px-2.5 py-1.5 text-xs text-slate-800 placeholder:text-slate-400 focus:border-slate-400 focus:bg-white focus:outline-none"
        />
      </div>

      <p id="status" class="px-4 py-10 text-center text-sm text-slate-500">Reading…</p>

      <section id="list" class="hidden flex-1 space-y-3 overflow-y-auto px-4 py-3"></section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
